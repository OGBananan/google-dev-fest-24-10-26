<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMC Civic Agent</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#272e38; --fg:#e6edf3;
    --muted:#8b949e; --accent:#4f9cf9; --ok:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:0 16px 48px;max-width:560px;margin-inline:auto}
  header{padding:20px 0 16px}
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,textarea{width:100%;background:#0d1117;color:var(--fg);border:1px solid var(--line);
       border-radius:8px;padding:10px;font:inherit;font-size:15px}
  textarea{resize:vertical;min-height:72px}
  button{width:100%;padding:13px;border:0;border-radius:8px;font:inherit;font-weight:600;
         background:var(--accent);color:#06121f;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  video,img#shot{width:100%;border-radius:8px;background:#000;display:block;aspect-ratio:4/3;object-fit:cover}
  .row{display:flex;gap:8px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
        border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-bottom:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .dot.on{background:var(--ok)}
  .trace{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  .step{opacity:0;transform:translateY(4px);animation:in .28s forwards;
        padding:7px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  @keyframes in{to{opacity:1;transform:none}}
  .step .n{color:var(--accent)}
  .step .v{color:var(--muted)}
  .tid{font:600 19px ui-monospace,Menlo,monospace;color:var(--ok);letter-spacing:.5px}
  .err{color:#f85149;font-size:14px}
  .list{font-size:14px}
  .list .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
            border-bottom:1px solid var(--line)}
  .list .it:last-child{border-bottom:0}
  .list code{color:var(--muted);font-size:12px}
  h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;
     text-transform:uppercase;letter-spacing:.6px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>AMC Civic Agent</h1>
  <div class="sub">Photograph the problem. The agent routes and files it.</div>
</header>

<div class="card" id="capture-card">
  <div class="chip"><span class="dot" id="geo-dot"></span><span id="geo-text">Locating...</span></div>
  <video id="cam" playsinline muted autoplay></video>
  <img id="shot" class="hidden" alt="Captured photo">
  <div class="row">
    <button id="shoot">Capture photo</button>
    <button id="retake" class="ghost hidden">Retake</button>
  </div>
</div>

<div class="card">
  <label for="desc">What's wrong?</label>
  <textarea id="desc" placeholder="Large pothole in the middle of the road, cars swerving around it."></textarea>
  <div style="margin-top:12px">
    <label for="area">Area <span style="opacity:.7">- used if location is unavailable</span></label>
    <input id="area" placeholder="e.g. Navrangpura">
  </div>
  <div class="row"><button id="submit" disabled>File complaint</button></div>
  <div id="err" class="err" style="margin-top:10px"></div>
</div>

<div class="card hidden" id="trace-card">
  <h2>Agent trace</h2>
  <div class="trace" id="trace"></div>
</div>

<div class="card hidden" id="result-card">
  <h2>Filed</h2>
  <div class="tid" id="tid"></div>
  <p id="reply" style="margin:10px 0 0;font-size:15px"></p>
  <div style="margin-top:14px">
    <label for="ask">Ask about this or any complaint</label>
    <input id="ask" placeholder="What's the status of AMC-2026-000123?">
    <div class="row"><button id="send" class="ghost">Send</button></div>
  </div>
</div>

<div class="card">
  <h2>Recent complaints</h2>
  <div class="list" id="list"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let coords = null, blob = null, sessionId = null;

// Fire geolocation on page load, not at submit: a cold fix takes 5-20s and
// that silence mid-demo reads as a hang. High accuracy is off on purpose --
// GPS will not lock indoors, WiFi positioning will.
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    p => {
      coords = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6) };
      $('#geo-dot').classList.add('on');
      $('#geo-text').textContent = coords.lat + ', ' + coords.lng;
    },
    () => { $('#geo-text').textContent = 'No location - type an area below'; },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 }
  );
}

(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    $('#cam').srcObject = stream;
  } catch (e) {
    $('#err').textContent = 'Camera unavailable: ' + e.message;
  }
})();

$('#shoot').onclick = () => {
  const v = $('#cam'), c = document.createElement('canvas');
  c.width = v.videoWidth || 1280;
  c.height = v.videoHeight || 960;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  c.toBlob(b => {
    blob = b;
    $('#shot').src = URL.createObjectURL(b);
    $('#shot').classList.remove('hidden');
    $('#cam').classList.add('hidden');
    $('#shoot').classList.add('hidden');
    $('#retake').classList.remove('hidden');
    $('#submit').disabled = false;
  }, 'image/jpeg', 0.85);
};

$('#retake').onclick = () => {
  blob = null;
  $('#shot').classList.add('hidden');
  $('#cam').classList.remove('hidden');
  $('#shoot').classList.remove('hidden');
  $('#retake').classList.add('hidden');
  $('#submit').disabled = true;
};

function renderTrace(steps) {
  const box = $('#trace');
  box.innerHTML = '';
  $('#trace-card').classList.remove('hidden');
  steps.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'step';
    d.style.animationDelay = (i * 160) + 'ms';
    let v;
    if (s.kind === 'call') {
      v = Object.entries(s.args)
        .filter(([k]) => k !== 'image_path')
        .map(([k, val]) => k + '=' + val).join(' ') || '...';
    } else {
      v = Object.values(s.data).join(' / ');
    }
    const arrow = s.kind === 'call' ? '-&gt;' : '&lt;-';
    d.innerHTML = '<span class="n">' + arrow + ' ' + s.name + '</span> <span class="v">' + v + '</span>';
    box.appendChild(d);
  });
}

$('#submit').onclick = async () => {
  if (!blob) return;
  $('#err').textContent = '';
  $('#submit').disabled = true;
  $('#submit').textContent = 'Agent working...';
  const fd = new FormData();
  fd.append('photo', blob, 'capture.jpg');
  fd.append('description', $('#desc').value);
  fd.append('area_name', $('#area').value);
  if (coords) { fd.append('lat', coords.lat); fd.append('lng', coords.lng); }
  try {
    const r = await fetch('/api/complaints', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    sessionId = d.session_id;
    renderTrace(d.trace);
    $('#result-card').classList.remove('hidden');
    $('#tid').textContent = d.tracking_id || '-';
    $('#reply').textContent = d.reply;
    loadList();
  } catch (e) {
    $('#err').textContent = 'Failed: ' + e.message;
  } finally {
    $('#submit').textContent = 'File complaint';
    $('#submit').disabled = false;
  }
};

$('#send').onclick = async () => {
  const msg = $('#ask').value.trim();
  if (!msg || !sessionId) return;
  $('#send').disabled = true;
  try {
    const r = await fetch('/api/complaints/' + sessionId + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const d = await r.json();
    renderTrace(d.trace);
    $('#reply').textContent = d.reply;
    $('#ask').value = '';
  } finally {
    $('#send').disabled = false;
  }
};

async function loadList() {
  const r = await fetch('/api/complaints');
  const items = await r.json();
  $('#list').innerHTML = items.map(c =>
    '<div class="it"><div><div>' + c.issue + ' - ' + c.wardName +
    '</div><code>' + c.trackingId + '</code></div>' +
    '<div style="color:var(--muted);font-size:13px">' + c.status + '</div></div>'
  ).join('') || '<div style="color:var(--muted)">None yet</div>';
}
loadList();
</script>
</body>
</html>
